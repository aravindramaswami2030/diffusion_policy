name: omnid_image

image_shape: [3, 240, 320]

shape_meta: &shape_meta
  obs:
    camera:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape: [9]          # gimbal_pos(9) or force (9)
      type: low_dim
  action:
    shape: [9]             # global mode, [3] for local mode

dataset:
  _target_: diffusion_policy.dataset.omnid_image_dataset.OmnidImageDataset
  zarr_path: ???
  shape_meta: *shape_meta
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null

env_runner:
  _target_: diffusion_policy.env_runner.omnid_image_runner.OmnidImageRunner
  output_dir: ???
